<body>
  <header class="site-header">

    <nav class="desktop-nav" aria-label="Main navigation">
      <a href="#trips">Trips</a>
      <a href="#how-it-works">How it works</a>

        <div><small>Talk to us</small><a href="tel:+989124650161">+98 912 465 0161</a></div>
